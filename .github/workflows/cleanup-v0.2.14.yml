name: Cleanup v0.2.14 trigger branch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/release-v0.2.14-trigger

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'release-v0.2.14-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary trigger branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release-v0.2.14-trigger"
