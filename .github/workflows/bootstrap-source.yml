name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          test -d .bootstrap || exit 0
          cat .bootstrap/chunk-* > /tmp/vidcore-source.b64
          base64 --decode /tmp/vidcore-source.b64 > /tmp/vidcore-source.tar.xz
          tar -xJf /tmp/vidcore-source.tar.xz -C .
          rm -rf .bootstrap
      - name: Commit source tree
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add native and web VidCore players'
          git push
