name: Recover and dispatch v0.2.12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-v0.2.12.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vidcore-v0.2.12-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected source update
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/apply-v0.2.12.py
          python .github/scripts/apply-v0.2.12.py
          rm -f .github/scripts/apply-v0.2.12.py
          rm -rf .github/scripts/__pycache__
          rm -f .github/workflows/retry-v0.2.12.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply corrected v0.2.12 source update'
          git push

      - name: Dispatch normal release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
