name: Bootstrap v0.2.9 release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/bootstrap-v0.2.9.trigger
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply staged v0.2.9 source
        run: |
          python3 -m py_compile .github/scripts/apply-v0.2.9.py
          python3 .github/scripts/apply-v0.2.9.py
          rm -f .github/scripts/apply-v0.2.9.py
          rm -rf .github/scripts/__pycache__
          rm -f .github/bootstrap-v0.2.9.trigger

      - name: Commit finished source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Apply v0.2.9 source update'
          git push origin "HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"

      - name: Dispatch Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_REF"
