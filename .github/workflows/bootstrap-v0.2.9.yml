name: Bootstrap v0.2.9 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v0.2.9.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged v0.2.9 source
        run: |
          python3 -m py_compile .github/scripts/apply-v0.2.9.py
          python3 .github/scripts/apply-v0.2.9.py
          rm -f .github/scripts/apply-v0.2.9.py
          rm -rf .github/scripts/__pycache__

      - name: Commit finished source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Apply v0.2.9 source update'
          git push

      - name: Dispatch Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
