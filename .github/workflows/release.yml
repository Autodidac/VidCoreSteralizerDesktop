name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vidcore-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit staged source updates
        shell: pwsh
        run: |
          $scripts = Get-ChildItem '.github/scripts/apply-v0.2.6*.py' -ErrorAction SilentlyContinue | Sort-Object Name
          foreach ($script in $scripts) {
            python -m py_compile $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid staged updater: $($script.Name)" }
            python $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "Source updater failed: $($script.Name)" }
          }

          if ($scripts.Count -gt 0) {
            Remove-Item '.github/scripts/apply-v0.2.6*.py' -Force -ErrorAction SilentlyContinue
            Remove-Item '.github/scripts/__pycache__' -Recurse -Force -ErrorAction SilentlyContinue
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m 'Rebuild v0.2.6 without native downloader behavior'
              if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
              git push
              if ($LASTEXITCODE -ne 0) { throw 'Source push failed.' }
            }
          }

          $target = (git rev-parse HEAD).Trim()
          "RELEASE_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read and validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a semantic version such as 0.2.6."
          }
          $cmake = Get-Content VidCoreNativePlayer/CMakeLists.txt -Raw
          if ($cmake -notmatch "VERSION\s+$([regex]::Escape($version))") {
            throw "VERSION ($version) does not match VidCoreNativePlayer/CMakeLists.txt."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and validate native player
        shell: cmd
        run: |
          cd VidCoreNativePlayer
          call build.bat

      - name: Scan native executable with Microsoft Defender
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'VidCoreNativePlayer/build/Release/VidCoreNativePlayer.exe').Path
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature $exe
          $scanResult = 'Microsoft Defender command-line scanner unavailable on this runner'

          $candidates = @()
          $fixed = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (Test-Path $fixed) { $candidates += Get-Item $fixed }
          $platform = Join-Path $env:ProgramData 'Microsoft/Windows Defender/Platform'
          if (Test-Path $platform) {
            $candidates += Get-ChildItem $platform -Filter MpCmdRun.exe -Recurse -ErrorAction SilentlyContinue
          }
          $scanner = $candidates | Sort-Object FullName -Descending | Select-Object -First 1
          if ($scanner) {
            & $scanner.FullName -Scan -ScanType 3 -File $exe
            $scanExit = $LASTEXITCODE
            if ($scanExit -ne 0) {
              throw "Microsoft Defender scan rejected the executable with exit code $scanExit."
            }
            $scanResult = 'passed: no detection reported by Microsoft Defender on the GitHub Windows runner'
          }

          New-Item -ItemType Directory -Force -Path security | Out-Null
          @"
          Shielded Native Stream Player v$env:VERSION security report
          Source commit: $env:RELEASE_TARGET
          Executable SHA-256: $hash
          Authenticode status: $($signature.Status)
          Publisher: $($signature.SignerCertificate.Subject)
          Defender scan: $scanResult
          Runner: windows-2022
          "@ | Set-Content security/SECURITY_REPORT.txt -Encoding utf8
          "DEFENDER_SCAN=$scanResult" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package native binary, source fallback, and web player
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $nativeStage = Join-Path $dist 'ShieldedNativeStreamPlayer'
          New-Item -ItemType Directory -Force -Path $nativeStage | Out-Null
          Copy-Item 'VidCoreNativePlayer/build/Release/VidCoreNativePlayer.exe' $nativeStage
          Copy-Item 'VidCoreNativePlayer/build/Release/assets' (Join-Path $nativeStage 'assets') -Recurse
          Copy-Item 'VidCoreNativePlayer/README.md' $nativeStage
          Copy-Item 'security/SECURITY_REPORT.txt' $nativeStage
          New-Item -ItemType Directory -Force -Path (Join-Path $nativeStage 'data') | Out-Null
          @('@echo off','cd /d "%~dp0"','start "" VidCoreNativePlayer.exe') |
            Set-Content (Join-Path $nativeStage 'run.bat') -Encoding ascii

          $sourceStage = Join-Path $dist 'ShieldedNativeStreamPlayer-source'
          New-Item -ItemType Directory -Force -Path $sourceStage | Out-Null
          foreach ($item in @('CMakeLists.txt','CMakePresets.json','README.md','build.bat','clean.bat','run.bat','assets','scripts','src','tests')) {
            $source = Join-Path 'VidCoreNativePlayer' $item
            if (Test-Path $source) { Copy-Item $source $sourceStage -Recurse }
          }
          Copy-Item 'security/SECURITY_REPORT.txt' $sourceStage

          $webStage = Join-Path $dist 'VidCoreWebPlayer'
          Copy-Item 'VidCoreWebPlayer' $webStage -Recurse

          $nativeZip = Join-Path $dist "ShieldedNativeStreamPlayer-v$env:VERSION-windows-x64.zip"
          $sourceZip = Join-Path $dist "ShieldedNativeStreamPlayer-v$env:VERSION-source.zip"
          $webZip = Join-Path $dist "VidCoreWebPlayer-v$env:VERSION.zip"
          Compress-Archive -Path $nativeStage -DestinationPath $nativeZip -CompressionLevel Optimal
          Compress-Archive -Path $sourceStage -DestinationPath $sourceZip -CompressionLevel Optimal
          Compress-Archive -Path $webStage -DestinationPath $webZip -CompressionLevel Optimal
          Copy-Item 'security/SECURITY_REPORT.txt' $dist

          $hashLines = Get-ChildItem $dist -Filter '*.zip' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashLines | Set-Content (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

          @"
          ## Shielded Native Stream Player v$env:VERSION

          This rebuild removes the native WinHTTP page scraper/downloader and automatic image-file deletion code after a Windows Defender detection report. WebView2 still keeps its profile, normal browser cache, IndexedDB, settings, and popup history in `data/` beside the executable.

          The Windows executable was scanned during this release workflow. Result: $env:DEFENDER_SCAN

          The binary is not Authenticode-signed, so Windows SmartScreen may still show an unknown-publisher reputation warning. A source-build ZIP is included so the native executable can be built locally with Visual Studio 2022.

          Existing v0.2.6 interface, provider, backup, library, blocker, and metadata-filtering work remains included. The readable `cache/<media>.jpg` and IMDb/TMDB native-fetch missions remain open until they can be restored through a signed or independently verified implementation.

          ### Assets
          - `ShieldedNativeStreamPlayer-v$env:VERSION-windows-x64.zip`
          - `ShieldedNativeStreamPlayer-v$env:VERSION-source.zip`
          - `VidCoreWebPlayer-v$env:VERSION.zip`
          - `SECURITY_REPORT.txt`
          - `SHA256SUMS.txt`
          "@ | Set-Content (Join-Path $dist 'RELEASE_NOTES.md') -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_TARGET `
            --title "Shielded Native Stream Player $env:TAG" `
            --notes-file dist/RELEASE_NOTES.md `
            --latest `
            dist/ShieldedNativeStreamPlayer-v$env:VERSION-windows-x64.zip `
            dist/ShieldedNativeStreamPlayer-v$env:VERSION-source.zip `
            dist/VidCoreWebPlayer-v$env:VERSION.zip `
            dist/SECURITY_REPORT.txt `
            dist/SHA256SUMS.txt

      - name: Record release workflow result
        if: always()
        shell: pwsh
        run: |
          $version = if ($env:VERSION) { $env:VERSION } else { (Get-Content VERSION -Raw).Trim() }
          $status = '${{ job.status }}'
          $target = if ($env:RELEASE_TARGET) { $env:RELEASE_TARGET } else { $env:GITHUB_SHA }
          @"
          # Release Status

          - Version: v$version
          - Status: $status
          - Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          - Source commit: $target
          - Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version
          "@ | Set-Content RELEASE_STATUS.md -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_STATUS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record v$version release status"
            git push
          }
