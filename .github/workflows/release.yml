name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vidcore-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit staged source update
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.github/scripts/apply-v0.2.5.part*' -ErrorAction SilentlyContinue | Sort-Object Name
          if ($parts.Count -gt 0) {
            $script = '.github/scripts/apply-v0.2.5.py'
            $parts | ForEach-Object { Get-Content $_.FullName -Raw } | Set-Content $script -Encoding utf8

            python -m py_compile $script
            if ($LASTEXITCODE -ne 0) {
              throw "The staged v0.2.5 updater is not valid Python."
            }

            python $script
            if ($LASTEXITCODE -ne 0) {
              throw "The v0.2.5 source update failed with exit code $LASTEXITCODE."
            }

            Remove-Item $script -Force -ErrorAction SilentlyContinue
            Remove-Item '.github/scripts/apply-v0.2.5.part*' -Force -ErrorAction SilentlyContinue
            Remove-Item '.github/scripts/apply-v0.2.5.py.gz.b64' -Force -ErrorAction SilentlyContinue
            Remove-Item '.github/scripts' -Force -ErrorAction SilentlyContinue

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m 'Improve artwork resolution, layout, links, and portable storage'
              if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
              git push
              if ($LASTEXITCODE -ne 0) { throw 'Source push failed.' }
            }
          }

          $target = (git rev-parse HEAD).Trim()
          "RELEASE_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read and validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a semantic version such as 0.2.5."
          }

          $cmake = Get-Content VidCoreNativePlayer/CMakeLists.txt -Raw
          if ($cmake -notmatch "VERSION\s+$([regex]::Escape($version))") {
            throw "VERSION ($version) does not match VidCoreNativePlayer/CMakeLists.txt."
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and validate native player
        shell: cmd
        run: |
          cd VidCoreNativePlayer
          call build.bat

      - name: Package native and web players
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $nativeStage = Join-Path $dist 'VidCoreNativePlayer'
          New-Item -ItemType Directory -Force -Path $nativeStage | Out-Null
          Copy-Item 'VidCoreNativePlayer/build/Release/VidCoreNativePlayer.exe' $nativeStage
          Copy-Item 'VidCoreNativePlayer/build/Release/assets' (Join-Path $nativeStage 'assets') -Recurse
          Copy-Item 'VidCoreNativePlayer/README.md' $nativeStage
          @(
            '@echo off',
            'cd /d "%~dp0"',
            'start "" VidCoreNativePlayer.exe'
          ) | Set-Content (Join-Path $nativeStage 'run.bat') -Encoding ascii

          $webStage = Join-Path $dist 'VidCoreWebPlayer'
          Copy-Item 'VidCoreWebPlayer' $webStage -Recurse

          $nativeZip = Join-Path $dist "VidCoreNativePlayer-v$env:VERSION-windows-x64.zip"
          $webZip = Join-Path $dist "VidCoreWebPlayer-v$env:VERSION.zip"
          Compress-Archive -Path $nativeStage -DestinationPath $nativeZip -CompressionLevel Optimal
          Compress-Archive -Path $webStage -DestinationPath $webZip -CompressionLevel Optimal

          $hashLines = Get-ChildItem $dist -Filter '*.zip' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashLines | Set-Content (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

          @"
          ## VidCore Steralizer Desktop v$env:VERSION

          ### Artwork resolution
          - Prefers exact Wikidata film posters and title logos before representative images
          - Rejects actor/director portraits, cast photos, red-carpet images, diagrams, maps, buildings, and unrelated subject photos
          - Adds strict film/TV article validation and a Wikimedia Commons fallback
          - Automatically removes already-saved mismatched artwork while preserving titles, lists, notes, and watched state
          - Displays posters at their complete aspect ratio instead of cropping them

          ### Layout and external lookup
          - Restores the provider/play section to the top of both players
          - Keeps the resolve metadata card below Stop/transport
          - Corrects right-sidebar card and action-button wrapping across desktop and collapsed layouts
          - Adds FastFlix, SeeFlix, and 123Movies title lookup buttons alongside IMDb, TMDB, and Wikipedia

          ### Portable native data
          - WebView2 browser and image cache, IndexedDB, localStorage, popup history, and settings live in `data/` beside the executable
          - Assets resolve relative to the executable instead of the launch working directory
          - The native package no longer creates its own application data folder under Local AppData

          ### Existing library and playback
          - Includes the built-in 105-title, 24-list starter library
          - Provider selector order remains VidCore, YTHD, VidUp
          - Compact version 2 backup and legacy version 1 import remain supported

          ### Assets
          - `VidCoreNativePlayer-v$env:VERSION-windows-x64.zip`
          - `VidCoreWebPlayer-v$env:VERSION.zip`
          - `SHA256SUMS.txt`

          The native player requires the Microsoft Edge WebView2 Runtime.
          "@ | Set-Content (Join-Path $dist 'RELEASE_NOTES.md') -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }

          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_TARGET `
            --title "VidCore Steralizer Desktop $env:TAG" `
            --notes-file dist/RELEASE_NOTES.md `
            --latest `
            dist/VidCoreNativePlayer-v$env:VERSION-windows-x64.zip `
            dist/VidCoreWebPlayer-v$env:VERSION.zip `
            dist/SHA256SUMS.txt

      - name: Record release workflow result
        if: always()
        shell: pwsh
        run: |
          $version = if ($env:VERSION) { $env:VERSION } else { (Get-Content VERSION -Raw).Trim() }
          $status = '${{ job.status }}'
          $target = if ($env:RELEASE_TARGET) { $env:RELEASE_TARGET } else { $env:GITHUB_SHA }
          @"
          # Release Status

          - Version: v$version
          - Status: $status
          - Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          - Source commit: $target
          - Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version
          "@ | Set-Content RELEASE_STATUS.md -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_STATUS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record v$version release status"
            git push
          }
