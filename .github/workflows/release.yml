name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vidcore-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit staged source updates
        shell: pwsh
        run: |
          $scripts = Get-ChildItem '.github/scripts/apply-v0.2.6*.py' -ErrorAction SilentlyContinue | Sort-Object Name
          foreach ($script in $scripts) {
            python -m py_compile $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Invalid staged updater: $($script.Name)"
            }
            python $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Source updater failed: $($script.Name)"
            }
          }

          if ($scripts.Count -gt 0) {
            Remove-Item '.github/scripts/apply-v0.2.6*.py' -Force -ErrorAction SilentlyContinue
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m 'Release IMDb TMDB cached artwork and compact blue player'
              if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
              git push
              if ($LASTEXITCODE -ne 0) { throw 'Source push failed.' }
            }
          }

          $target = (git rev-parse HEAD).Trim()
          "RELEASE_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read and validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a semantic version such as 0.2.6."
          }

          $cmake = Get-Content VidCoreNativePlayer/CMakeLists.txt -Raw
          if ($cmake -notmatch "VERSION\s+$([regex]::Escape($version))") {
            throw "VERSION ($version) does not match VidCoreNativePlayer/CMakeLists.txt."
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and validate native player
        shell: cmd
        run: |
          cd VidCoreNativePlayer
          call build.bat

      - name: Package native and web players
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $nativeStage = Join-Path $dist 'VidCoreNativePlayer'
          New-Item -ItemType Directory -Force -Path $nativeStage | Out-Null
          Copy-Item 'VidCoreNativePlayer/build/Release/VidCoreNativePlayer.exe' $nativeStage
          Copy-Item 'VidCoreNativePlayer/build/Release/assets' (Join-Path $nativeStage 'assets') -Recurse
          Copy-Item 'VidCoreNativePlayer/README.md' $nativeStage
          New-Item -ItemType Directory -Force -Path (Join-Path $nativeStage 'cache') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $nativeStage 'data') | Out-Null
          @(
            '@echo off',
            'cd /d "%~dp0"',
            'start "" VidCoreNativePlayer.exe'
          ) | Set-Content (Join-Path $nativeStage 'run.bat') -Encoding ascii

          $webStage = Join-Path $dist 'VidCoreWebPlayer'
          Copy-Item 'VidCoreWebPlayer' $webStage -Recurse

          $nativeZip = Join-Path $dist "VidCoreNativePlayer-v$env:VERSION-windows-x64.zip"
          $webZip = Join-Path $dist "VidCoreWebPlayer-v$env:VERSION.zip"
          Compress-Archive -Path $nativeStage -DestinationPath $nativeZip -CompressionLevel Optimal
          Compress-Archive -Path $webStage -DestinationPath $webZip -CompressionLevel Optimal

          $hashLines = Get-ChildItem $dist -Filter '*.zip' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashLines | Set-Content (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

          @"
          ## Shielded Native Stream Player v$env:VERSION

          ### Official artwork and portable cache
          - Resolves IMDb title/media imagery first
          - Uses TMDB title/backdrop imagery second
          - Uses strict Wikidata, Wikipedia, and Wikimedia Commons imagery only as fallback
          - Stores native artwork in `cache/` beside the executable
          - Reuses one media cache entry across VidCore, YTHD, and VidUp
          - Deletes cached artwork when the final saved library copy is removed
          - Prunes orphaned cache images at startup and after imports

          ### Interface
          - Renames the application to Shielded Native Stream Player
          - Keeps provider controls and the compact resolve card above the player
          - Uses square artwork and horizontal wrapping card actions
          - Changes the accent theme from purple to blue
          - Keeps popup protection active without displaying a blocker count

          ### Library and compatibility
          - Adds Wednesday, Landman, and Mating Season to the non-destructive built-in defaults
          - Preserves existing user edits and deleted-seed tracking
          - Keeps provider order VidCore, YTHD, VidUp
          - Keeps compact version 2 backups and legacy version 1 imports
          - Keeps FastFlix, SeeFlix, and 123Movies title lookup buttons

          ### Assets
          - `VidCoreNativePlayer-v$env:VERSION-windows-x64.zip`
          - `VidCoreWebPlayer-v$env:VERSION.zip`
          - `SHA256SUMS.txt`

          The native player requires the Microsoft Edge WebView2 Runtime.
          "@ | Set-Content (Join-Path $dist 'RELEASE_NOTES.md') -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }

          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_TARGET `
            --title "Shielded Native Stream Player $env:TAG" `
            --notes-file dist/RELEASE_NOTES.md `
            --latest `
            dist/VidCoreNativePlayer-v$env:VERSION-windows-x64.zip `
            dist/VidCoreWebPlayer-v$env:VERSION.zip `
            dist/SHA256SUMS.txt

      - name: Record release workflow result
        if: always()
        shell: pwsh
        run: |
          $version = if ($env:VERSION) { $env:VERSION } else { (Get-Content VERSION -Raw).Trim() }
          $status = '${{ job.status }}'
          $target = if ($env:RELEASE_TARGET) { $env:RELEASE_TARGET } else { $env:GITHUB_SHA }
          @"
          # Release Status

          - Version: v$version
          - Status: $status
          - Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          - Source commit: $target
          - Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version
          "@ | Set-Content RELEASE_STATUS.md -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_STATUS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record v$version release status"
            git push
          }
