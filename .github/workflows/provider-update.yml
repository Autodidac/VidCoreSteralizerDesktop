name: Apply provider and pause update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.2.2 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def patch_html(path):
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'<input\s+id="baseUrl"\s+type="url"\s+value="https://vidcore\.net"\s+spellcheck="false"\s+autocomplete="off">',
                  re.S,
              )
              replacement = '''<select id="baseUrl" aria-label="Streaming provider">
              <option value="https://vidcore.net" selected>VidCore</option>
              <option value="https://ythd.org/embed">YTHD</option>
              <option value="https://vidup.to">VidUp</option>
            </select>'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f'Provider input not found in {path}')

              play = '<button id="playButton" class="button primary">Play</button>'
              pause = play + '\n\n          <button id="pauseButton" class="button">Pause</button>'
              if play not in text:
                  raise RuntimeError(f'Play button not found in {path}')
              text = text.replace(play, pause, 1)

              scripts = '  <script src="metadata.js"></script>\n  <script src="scanner.js"></script>'
              scripts_with_providers = '  <script src="metadata.js"></script>\n  <script src="providers.js"></script>\n  <script src="scanner.js"></script>'
              if scripts not in text:
                  raise RuntimeError(f'Script order marker not found in {path}')
              text = text.replace(scripts, scripts_with_providers, 1)
              path.write_text(text, encoding='utf-8', newline='\n')

          provider_script = r'''"use strict";

(() => {
  const metadata = globalThis.VidCoreMetadata;
  if (!metadata) {
    throw new Error("VidCoreMetadata must load before providers.js.");
  }

  const providers = Object.freeze([
    Object.freeze({
      id: "vidcore",
      label: "VidCore",
      baseUrl: "https://vidcore.net"
    }),
    Object.freeze({
      id: "ythd",
      label: "YTHD",
      baseUrl: "https://ythd.org/embed"
    }),
    Object.freeze({
      id: "vidup",
      label: "VidUp",
      baseUrl: "https://vidup.to"
    })
  ]);

  function providerFor(value) {
    const normalized = metadata.normalizeBaseUrl(value);
    return providers.find(provider => provider.baseUrl === normalized) || providers[0];
  }

  function buildPlayerUrl(entry, autoplay = true) {
    const normalized = metadata.normalizeEntry(entry);
    const provider = providerFor(normalized.baseUrl);
    let url;

    if (provider.id === "ythd") {
      const path = normalized.mode === "movie"
        ? `/movie/${encodeURIComponent(normalized.id)}`
        : `/tv/${encodeURIComponent(normalized.id)}`;
      url = new URL(provider.baseUrl + path);

      if (normalized.mode === "tv") {
        url.searchParams.set("season", String(normalized.season));
        url.searchParams.set("episode", String(normalized.episode));
      }

      return url.href;
    }

    const path = normalized.mode === "movie"
      ? `/movie/${encodeURIComponent(normalized.id)}`
      : `/tv/${encodeURIComponent(normalized.id)}/${normalized.season}/${normalized.episode}`;
    url = new URL(provider.baseUrl + path);
    url.searchParams.set("autoPlay", autoplay ? "true" : "false");
    url.searchParams.set("title", "true");
    url.searchParams.set("poster", "true");
    url.searchParams.set("fullscreenButton", "true");
    return url.href;
  }

  globalThis.VidCoreMetadata = Object.freeze({
    ...metadata,
    buildPlayerUrl
  });

  function requestPause() {
    const player = document.querySelector("#player");
    player?.contentWindow?.postMessage(
      { type: "VIDCORE_PLAYER_COMMAND", action: "pause" },
      "*"
    );

    const title = document.querySelector("#statusTitle");
    const text = document.querySelector("#statusText");
    const panel = document.querySelector("#statusPanel");
    if (title) title.textContent = "Pause requested";
    if (text) {
      text.textContent = globalThis.chrome?.webview
        ? "The native player sent pause into the active provider frame."
        : "Pause was sent to the provider. Browser support depends on the embedded player.";
    }
    if (panel) panel.dataset.type = "ok";
  }

  function wirePauseButton() {
    document.querySelector("#pauseButton")?.addEventListener("click", requestPause);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", wirePauseButton, { once: true });
  } else {
    wirePauseButton();
  }

  globalThis.VidCoreProviders = Object.freeze({
    providers,
    providerFor,
    buildPlayerUrl,
    requestPause
  });
})();
'''

          for folder in ('VidCoreNativePlayer/assets', 'VidCoreWebPlayer'):
              folder_path = root / folder
              patch_html(folder_path / 'index.html')
              (folder_path / 'providers.js').write_text(provider_script, encoding='utf-8', newline='\n')

              styles = folder_path / 'styles.css'
              css = styles.read_text(encoding='utf-8')
              marker = '/* v0.2.2 provider controls */'
              if marker not in css:
                  css += '''\n\n/* v0.2.2 provider controls */
@media (min-width: 1181px) {
  .source-panel {
    grid-template-columns:
        minmax(210px, 1fr)
        96px
        minmax(120px, 0.42fr)
        auto
        auto
        auto
        auto
        auto
        auto
        124px
        auto;
  }
}
'''
              styles.write_text(css, encoding='utf-8', newline='\n')

          webview = root / 'VidCoreNativePlayer/src/vidcore.webview.ixx'
          webview_text = webview.read_text(encoding='utf-8')
          if 'VIDCORE_PLAYER_COMMAND' not in webview_text:
              listener = r'''

    addEventListener("message", (event) => {
        const command = event.data;
        if (!command ||
            command.type !== "VIDCORE_PLAYER_COMMAND" ||
            command.action !== "pause") {
            return;
        }

        for (const frame of document.querySelectorAll("iframe")) {
            try {
                frame.contentWindow?.postMessage(command, "*");
            } catch {
            }
        }

        for (const media of document.querySelectorAll("video, audio")) {
            try {
                media.pause();
            } catch {
            }
        }
    }, true);
'''
              marker = '})();\n)JS";'
              if marker not in webview_text:
                  raise RuntimeError('Popup guard closing marker not found')
              webview_text = webview_text.replace(marker, listener + '\n})();\n)JS";', 1)
              webview.write_text(webview_text, encoding='utf-8', newline='\n')

          validate = root / 'VidCoreNativePlayer/validate.bat'
          validate_text = validate.read_text(encoding='utf-8')
          if 'assets\\providers.js' not in validate_text:
              validate_text = validate_text.replace(
                  'node --check assets\\metadata.js\nif errorlevel 1 exit /b %errorlevel%\n',
                  'node --check assets\\metadata.js\nif errorlevel 1 exit /b %errorlevel%\n\nnode --check assets\\providers.js\nif errorlevel 1 exit /b %errorlevel%\n',
                  1,
              )
          if 'providers.test.mjs' not in validate_text:
              validate_text = validate_text.replace(
                  'node tests\\logic.test.mjs\nif errorlevel 1 exit /b %errorlevel%\n',
                  'node tests\\logic.test.mjs\nif errorlevel 1 exit /b %errorlevel%\n\nnode tests\\providers.test.mjs\nif errorlevel 1 exit /b %errorlevel%\n',
                  1,
              )
          validate.write_text(validate_text, encoding='utf-8', newline='\n')

          test = r'''import assert from "node:assert/strict";
import fs from "node:fs";
import path from "node:path";
import vm from "node:vm";
import { fileURLToPath } from "node:url";

const directory = path.dirname(fileURLToPath(import.meta.url));
const root = path.resolve(directory, "..");
const repositoryRoot = path.resolve(root, "..");
const providerCode = fs.readFileSync(
  path.join(root, "assets", "providers.js"),
  "utf8"
);

const context = {
  URL,
  document: {
    readyState: "loading",
    addEventListener() {},
    querySelector() { return null; }
  },
  VidCoreMetadata: {
    normalizeBaseUrl(value) {
      const parsed = new URL(String(value).trim());
      return parsed.origin + parsed.pathname.replace(/\\/+$/, "");
    },
    normalizeEntry(entry) {
      return {
        baseUrl: this.normalizeBaseUrl(entry.baseUrl),
        mode: entry.mode === "tv" ? "tv" : "movie",
        id: String(entry.id),
        season: Number(entry.season || 1),
        episode: Number(entry.episode || 1)
      };
    }
  }
};
vm.createContext(context);
vm.runInContext(providerCode, context);

assert.deepEqual(
  [...context.VidCoreProviders.providers].map(provider => provider.label),
  ["VidCore", "YTHD", "VidUp"]
);

const build = context.VidCoreMetadata.buildPlayerUrl;
assert.equal(
  build({ baseUrl: "https://vidcore.net", mode: "movie", id: "27205" }),
  "https://vidcore.net/movie/27205?autoPlay=true&title=true&poster=true&fullscreenButton=true"
);
assert.equal(
  build({ baseUrl: "https://ythd.org/embed", mode: "movie", id: "tt0466342" }),
  "https://ythd.org/embed/movie/tt0466342"
);
assert.equal(
  build({ baseUrl: "https://ythd.org/embed", mode: "tv", id: "1396", season: 2, episode: 3 }),
  "https://ythd.org/embed/tv/1396?season=2&episode=3"
);
assert.equal(
  build({ baseUrl: "https://vidup.to", mode: "tv", id: "1396", season: 2, episode: 3 }),
  "https://vidup.to/tv/1396/2/3?autoPlay=true&title=true&poster=true&fullscreenButton=true"
);

for (const htmlPath of [
  path.join(root, "assets", "index.html"),
  path.join(repositoryRoot, "VidCoreWebPlayer", "index.html")
]) {
  const html = fs.readFileSync(htmlPath, "utf8");
  const vidcore = html.indexOf('>VidCore</option>');
  const ythd = html.indexOf('>YTHD</option>');
  const vidup = html.indexOf('>VidUp</option>');
  assert.ok(vidcore >= 0 && vidcore < ythd && ythd < vidup);
  assert.match(
    html,
    /id="playButton"[^>]*>Play<\\/button>\\s*<button id="pauseButton"[^>]*>Pause<\\/button>/
  );
  assert.ok(
    html.indexOf('src="metadata.js"') < html.indexOf('src="providers.js"') &&
    html.indexOf('src="providers.js"') < html.indexOf('src="scanner.js"')
  );
}

const webview = fs.readFileSync(
  path.join(root, "src", "vidcore.webview.ixx"),
  "utf8"
);
assert.match(webview, /VIDCORE_PLAYER_COMMAND/);
assert.match(webview, /media\\.pause\\(\\)/);

console.log("Provider routing and pause-control checks passed.");
'''
          (root / 'VidCoreNativePlayer/tests/providers.test.mjs').write_text(
              test,
              encoding='utf-8',
              newline='\n',
          )

          replace_once(
              root / 'VidCoreNativePlayer/CMakeLists.txt',
              'VERSION 0.2.1',
              'VERSION 0.2.2',
          )
          (root / 'VERSION').write_text('0.2.2\n', encoding='utf-8', newline='\n')

          root_readme = root / 'README.md'
          readme_text = root_readme.read_text(encoding='utf-8')
          if 'VidCore, YTHD, and VidUp' not in readme_text:
              readme_text = readme_text.replace(
                  '## Current corrections\n',
                  '## Current corrections\n\n- Provider choices are VidCore, YTHD, and VidUp in that order.\n- Pause sits directly beside Play; the native player injects pause through nested provider frames.\n',
                  1,
              )
          root_readme.write_text(readme_text, encoding='utf-8', newline='\n')

          for readme_path in [
              root / 'VidCoreNativePlayer/README.md',
              root / 'VidCoreWebPlayer/README.md',
          ]:
              text = readme_path.read_text(encoding='utf-8')
              title_end = text.find('\n') + 1
              section = '''\n## v0.2.2 providers and playback controls\n\n- Provider selector order: VidCore, YTHD, VidUp.\n- Provider-aware movie and TV URL routing.\n- Pause button placed directly beside Play.\n- The native build injects pause into nested cross-origin provider frames.\n\n'''
              if '## v0.2.2 providers and playback controls' not in text:
                  text = text[:title_end] + section + text[title_end:]
              readme_path.write_text(text, encoding='utf-8', newline='\n')

          mission = root / 'missioncache.md'
          mission_text = mission.read_text(encoding='utf-8')
          additions = '''- [x] Add VidCore, YTHD, and VidUp provider choices in that order to both players.\n- [x] Add provider-aware movie and TV embed URL construction.\n- [x] Add Pause directly beside Play in both players.\n- [x] Inject recursive media pause handling into native WebView2 provider frames.\n- [x] Add provider-routing and pause-control validation coverage.\n- [x] Publish release `v0.2.2` with refreshed native and web-player assets.\n\n'''
          if 'Add VidCore, YTHD, and VidUp provider choices' not in mission_text:
              mission_text = mission_text.replace('## Open / provider-limited\n', additions + '## Open / provider-limited\n', 1)
          mission.write_text(mission_text, encoding='utf-8', newline='\n')

          release = root / '.github/workflows/release.yml'
          release_text = release.read_text(encoding='utf-8')
          if 'VidCore, YTHD, and VidUp provider selector' not in release_text:
              release_text = release_text.replace(
                  '          - Stronger Wikidata and Wikipedia artwork repair\n',
                  '          - Stronger Wikidata and Wikipedia artwork repair\n          - VidCore, YTHD, and VidUp provider selector\n          - Pause control directly beside Play\n',
                  1,
              )
          release.write_text(release_text, encoding='utf-8', newline='\n')
          PY

      - name: Validate JavaScript and tests
        shell: bash
        run: |
          node --check VidCoreNativePlayer/assets/providers.js
          node --check VidCoreWebPlayer/providers.js
          node VidCoreNativePlayer/tests/static-smoke.test.mjs
          node VidCoreNativePlayer/tests/logic.test.mjs
          node VidCoreNativePlayer/tests/providers.test.mjs

      - name: Commit update
        shell: bash
        run: |
          rm -f .github/workflows/provider-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add providers and pause control'
          git push
